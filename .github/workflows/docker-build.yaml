name: Build and Push Docker Image

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SVR_NAME: ${{ github.event.repository.name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Google autocomplete seeds
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          seeds = [
              'bills must be paid loan',
              'bills must be paid toni',
              'bills must be paid pay back',
              'bills must be paid big t',
              'bills must be paid double or nothing',
              'bills must be paid gambling',
              'bills must be paid coin rain',
              'bills must be paid coins',
              'bills must be paid super j',
              'bills must be paid super jackpot',
              'bills must be paid skill',
              'bills must be paid skill tree',
              'bills must be paid maxed',
              'bills must be paid maxed achievement',
              'bills must be paid achievement max',
              'bills must be paid jackpot achievement',
          ]
          for seed in seeds:
              params = urllib.parse.urlencode({
                  'client': 'firefox',
                  'q': seed,
                  'hl': 'en',
                  'gl': 'us',
              })
              url = 'https://suggestqueries.google.com/complete/search?' + params
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      data = json.loads(response.read().decode('utf-8'))
                  print('SUGGEST_SEED:', seed)
                  print('SUGGESTIONS:', json.dumps(data[1], ensure_ascii=False))
              except Exception as exc:
                  print('SUGGEST_SEED:', seed)
                  print('SUGGEST_ERROR:', repr(exc))
          PY

      - name: Create .env.production
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        if: ${{ env.ENV_PRODUCTION != '' }}
        run: echo "$ENV_PRODUCTION" > .env.production

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
