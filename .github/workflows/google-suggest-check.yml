name: Google Suggest Check

on:
  pull_request:
    branches: ['main']

jobs:
  suggest:
    runs-on: ubuntu-latest
    steps:
      - name: Query en-US Google autocomplete
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          seeds = [
              'bills must be paid loan',
              'bills must be paid toni',
              'bills must be paid pay back',
              'bills must be paid big t',
              'bills must be paid double or nothing',
              'bills must be paid gambling',
              'bills must be paid coin rain',
              'bills must be paid coins',
              'bills must be paid super j',
              'bills must be paid super jackpot',
              'bills must be paid skill',
              'bills must be paid skill tree',
              'bills must be paid maxed',
              'bills must be paid maxed achievement',
              'bills must be paid achievement max',
              'bills must be paid jackpot achievement',
          ]
          for seed in seeds:
              params = urllib.parse.urlencode({
                  'client': 'firefox',
                  'q': seed,
                  'hl': 'en',
                  'gl': 'us',
              })
              url = 'https://suggestqueries.google.com/complete/search?' + params
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=15) as response:
                  data = json.loads(response.read().decode('utf-8'))
              print('SUGGEST_SEED:', seed)
              print('SUGGESTIONS:', json.dumps(data[1], ensure_ascii=False))
          PY
